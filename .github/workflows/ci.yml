name: build-and-test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Mikroservis.slnx --locked-mode
      - run: dotnet build Mikroservis.slnx -c Release --no-restore
      - run: dotnet test Mikroservis.slnx -c Release --no-build --no-restore
