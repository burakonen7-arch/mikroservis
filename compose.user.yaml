name: user-sql-practice
services:
  user-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: user_app
      POSTGRES_PASSWORD: user_dev_password
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - user-postgres-data:/var/lib/postgresql
      - ./src/User/User.Infrastructure/Sql/Init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U user_app -d users"]
      interval: 3s
      timeout: 3s
      retries: 30
  user-api:
    build:
      context: .
      dockerfile: src/User/User.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: Host=user-db;Port=5432;Database=users;Username=user_app;Password=user_dev_password
    ports: ["127.0.0.1:5003:8080"]
    depends_on:
      user-db: {condition: service_healthy}
volumes:
  user-postgres-data:
