receivers:
  otlp:
    protocols:
      grpc: {endpoint: "0.0.0.0:4317"}
      http: {endpoint: "0.0.0.0:4318"}
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch: {}
exporters:
  debug: {verbosity: basic}
  otlp/aspire:
    endpoint: aspire-dashboard:18889
    tls: {insecure: true}
service:
  pipelines:
    traces: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [debug, otlp/aspire]}
    metrics: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [debug, otlp/aspire]}
    logs: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [debug, otlp/aspire]}
