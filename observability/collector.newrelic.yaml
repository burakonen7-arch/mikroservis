receivers:
  otlp:
    protocols:
      grpc: {endpoint: "0.0.0.0:4317"}
      http: {endpoint: "0.0.0.0:4318"}
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch: {}
exporters:
  otlp/aspire:
    endpoint: aspire-dashboard:18889
    tls: {insecure: true}
  otlphttp/newrelic:
    endpoint: ${env:NEW_RELIC_OTLP_ENDPOINT}
    headers:
      api-key: ${env:NEW_RELIC_LICENSE_KEY}
    retry_on_failure: {enabled: true}
    sending_queue: {enabled: true, queue_size: 1000}
service:
  pipelines:
    traces: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlphttp/newrelic, otlp/aspire]}
    metrics: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlphttp/newrelic, otlp/aspire]}
    logs: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlphttp/newrelic, otlp/aspire]}
